<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --field:#F5F5F7; --ink:#111111; --accent:#111111; --ease:cubic-bezier(.4,0,.2,1); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter,ui-sans-serif,system-ui,sans-serif; background:var(--field); color:var(--ink); -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    nav { display:flex; justify-content:space-between; padding:20px 28px; font-size:13px; letter-spacing:.04em; }
    .hero { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:80px 24px; }
    .mark { width:120px; height:120px; border-radius:28px; background:#111; margin-bottom:40px; }
    h1 { font-size:clamp(40px,8vw,72px); font-weight:500; letter-spacing:.02em; max-width:12ch; line-height:1.05; }
    .hero p { margin-top:20px; font-size:18px; opacity:.62; max-width:24ch; }
    .cta { margin-top:40px; border:1px solid #111; padding:12px 22px; font-size:14px; letter-spacing:.03em; display:inline-block; }
    section { max-width:640px; margin:0 auto; padding:140px 24px; }
    section h2 { font-size:clamp(26px,4vw,40px); font-weight:500; letter-spacing:.02em; max-width:14ch; }
    section p { margin-top:20px; font-size:18px; line-height:1.55; max-width:34ch; opacity:.62; }
    footer { text-align:center; padding:80px 24px; font-size:12px; letter-spacing:.06em; opacity:.4; }
  </style>
</head>
<body>
  <nav><span>Lumen</span><a href="#">Get the card</a></nav>
  <header class="hero">
    <div class="mark" aria-hidden="true"></div>
    <h1>Quiet money.</h1>
    <p>A card that disappears until you need it.</p>
    <a class="cta" href="#">Get the card</a>
  </header>
  <section>
    <h2>One number. One tap.</h2>
    <p>No rewards maze. No five colors. The product is the field.</p>
  </section>
  <section>
    <h2>It holds.</h2>
    <p>The last screen is empty on purpose. That is the point.</p>
  </section>
  <footer>Dogfood page. Designed with decided. Not a real product.</footer>
</body>
</html>
